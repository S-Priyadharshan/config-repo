server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

spring:
  cloud:
    gateway:
      routes[0]:
        id: auth_service
        uri: lb://auth_service
        predicates[0]: Path=/api/v1/auth/**
