spring:
  application:
    name: auth_service

  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/TradeHub

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    
logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
    
oauth:
  client-secret: ${TRADEHUB_CLIENT_SECRET}
