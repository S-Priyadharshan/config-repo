server:
  port: 8084

spring:
  application:
    name: market-service
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.security: TRACE
    org.springframework.web: DEBUG
