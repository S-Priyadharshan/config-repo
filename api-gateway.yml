server:
  port: 8080

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

spring:
  cloud:
    gateway:
      routes:
        - id: auth_service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
            
        - id: user_service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**

        - id: market_service
          uri:: lb://market-service
          predicates:
            - Path=/api/v1/market/**
            
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.web.reactive: TRACE
